name: Keep Supabase Alive

on:
  schedule:
    # Ejecuta cada 3 dias a las 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Consulta liviana a Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL no configurado, se omite"
            exit 0
          fi
          curl -s "${SUPABASE_URL}/rest/v1/stores?select=slug" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --max-time 10
          echo "Keep-alive ejecutado correctamente"
