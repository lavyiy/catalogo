name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days
    - every: 3 days
  workflow_push:
    branches:
      - main

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      # Acceso a secrets del repositorio
      secrets: read

    steps:
      - name: Obtener secrets de Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> $GITHUB_ENV

      - name: Ejecutar consulta liviana
        env:
          SUPABASE_PROJECT: $SUPABASE_URL
        script: |
          # Consulta lightweight para mantener la conexion activa
          # Usamos la anon key pública (solo lectura)
          curl -s "https://${SUPABASE_URL}/rest/stores?select=slug" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: bearer ${SUPABASE_ANON_KEY}" \
            --max-time 10

      - name: Verificar estado
        script: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "⚠️ VITE_SUPABASE_URL no configurado, skip"
            exit 0
          fi
          echo "✅ Keep-alive executed for Supabase project"